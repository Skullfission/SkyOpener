<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sky Opener</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #cfe; font-family: ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  #game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }
  #fsBtn { position: fixed; top: 12px; right: 14px; z-index: 20; background: rgba(0,20,30,0.6); color: #6ff7c8; border: 1px solid #6ff7c8; border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  #fsBtn:hover { background: rgba(0,40,60,0.85); }
  #hud { position: fixed; inset: 0; pointer-events: none; padding: 14px 18px; display: flex; flex-direction: column; justify-content: space-between; }
  .row { display: flex; justify-content: space-between; gap: 16px; }
  .panel { background: rgba(0,20,30,0.45); border: 1px solid rgba(120,255,220,0.3); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(2px); font-size: 13px; line-height: 1.5; }
  .big { font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #6ff7c8; }
  #reticle { position: fixed; left: 50%; top: 50%; width: 28px; height: 28px; transform: translate(-50%,-50%); border: 1px solid #6ff7c8; border-radius: 50%; pointer-events: none; opacity: 0.7; }
  #reticle::before, #reticle::after { content:""; position:absolute; background:#6ff7c8; }
  #reticle::before { left: 50%; top: -6px; bottom: -6px; width: 1px; transform: translateX(-50%); }
  #reticle::after { top: 50%; left: -6px; right: -6px; height: 1px; transform: translateY(-50%); }

  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(0,30,40,0.85), rgba(0,0,0,0.95)); z-index: 10; }
  .card { max-width: 560px; padding: 24px 28px; border: 1px solid rgba(120,255,220,0.4); border-radius: 12px; background: rgba(0,15,25,0.9); }
  .card h1 { margin: 0 0 8px; color: #6ff7c8; letter-spacing: 2px; }
  .title-card { text-align: center; padding: 36px 44px; max-width: 640px; }
  .title-card h1 { font-size: 56px; letter-spacing: 10px; margin: 0 0 4px; color: #6ff7c8; text-shadow: 0 0 24px rgba(120,255,220,0.45), 0 0 2px #fff; }
  .title-card .sub { color: #9affda; letter-spacing: 4px; font-size: 13px; margin: 0 0 20px; opacity: 0.8; }
  .title-card .hint { font-size: 12px; opacity: 0.7; margin-top: 14px; }
  .card h2 { margin: 0 0 8px; color: #6ff7c8; letter-spacing: 2px; }
  .card p, .card label { margin: 6px 0; color: #cfe; display: block; }
  .card button { margin-top: 14px; background: #6ff7c8; color: #001018; border: 0; padding: 10px 18px; font-weight: 700; border-radius: 6px; cursor: pointer; font-family: inherit; margin-right: 8px; }
  .card button:hover { background: #9affda; }
  .card button.secondary { background: transparent; color: #6ff7c8; border: 1px solid #6ff7c8; }
  kbd { background:#022; border:1px solid #6ff7c8; border-radius:4px; padding:1px 6px; font-size:12px; color:#6ff7c8; }
  .hide { display: none !important; }
  .slider-row { display: grid; grid-template-columns: 110px 1fr 50px 60px; gap: 10px; align-items: center; margin: 10px 0; }
  .slider-row span { color: #6ff7c8; font-size: 13px; }
  .slider-row input[type=range] { width: 100%; accent-color: #6ff7c8; }
  .slider-row input[type=checkbox] { accent-color: #6ff7c8; transform: scale(1.2); }
  .slider-row .val { text-align: right; color: #cfe; font-size: 12px; font-variant-numeric: tabular-nums; }
  #musicPick { color:#9affda; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="fsBtn" title="Fullscreen (F)">⛶ Fullscreen</button>

<div id="hud" class="hide">
  <div class="row">
    <div class="panel"><div>SCORE</div><div class="big" id="score">0</div></div>
    <div class="panel"><div>SHIELD</div><div class="big" id="shield">100</div></div>
    <div class="panel"><div>MISSILES</div><div class="big" id="missiles">0</div></div>
    <div class="panel"><div>SPEED</div><div class="big" id="speed">1.0x</div></div>
  </div>
  <div class="row">
    <div class="panel">Roll: <kbd>Q</kbd>/<kbd>E</kbd> · Loop: 2×<kbd>W</kbd>/<kbd>S</kbd> · Fire: <kbd>Space</kbd> · Missile: <kbd>M</kbd>/RClick · Pause: <kbd>Esc</kbd> · Reset: <kbd>R</kbd></div>
    <div class="panel" id="msg"></div>
  </div>
</div>
<div id="reticle" class="hide"></div>

<!-- Title screen -->
<div id="startOverlay" class="overlay">
  <div class="card title-card">
    <h1>SKY OPENER</h1>
    <div class="sub">RAIL SHOOTER</div>
    <button id="startBtn">START</button>
    <div class="hint">Press <kbd>Esc</kbd> in-game for options · <kbd>F</kbd> for fullscreen</div>
  </div>
</div>

<!-- Pause menu -->
<div id="pauseOverlay" class="overlay hide">
  <div class="card">
    <h2>PAUSED</h2>
    <div class="slider-row">
      <span>Master</span>
      <input id="volMaster" type="range" min="0" max="1" step="0.01" value="0.8">
      <span class="val" id="volMasterVal">80%</span>
      <span></span>
    </div>
    <div class="slider-row">
      <span>Music</span>
      <input id="volMusic" type="range" min="0" max="1" step="0.01" value="0.25">
      <span class="val" id="volMusicVal">25%</span>
      <label><input id="muteMusic" type="checkbox"> mute</label>
    </div>
    <div class="slider-row">
      <span>SFX</span>
      <input id="volSfx" type="range" min="0" max="1" step="0.01" value="0.5">
      <span class="val" id="volSfxVal">50%</span>
      <label><input id="muteSfx" type="checkbox"> mute</label>
    </div>
    <p style="margin-top:14px;font-size:12px;opacity:0.8">Press <kbd>Esc</kbd> to resume · <kbd>R</kbd> to restart</p>
    <button id="resumeBtn">Resume</button>
    <button id="restartBtn" class="secondary">Restart</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
